# Numeric knobs for `perflab optimize` (grid search) and `perflab agent`.
dtype: "fp16"          # fp16 or fp32
batch: 1               # pinned by contract.fixed_params — changing it changes
                       # the problem size, not the implementation

# Grid search space for `perflab optimize`.
# batch is deliberately NOT swept: it is contract-pinned, so every batch != 1
# trial would be rejected as a contract violation. Optimize matmul_op.py
# (torch.compile, better kernels) rather than the problem definition.
sweep:
  dtype: ["fp16", "fp32"]
