name: "matmul_python_pure"
workspace: "tasks/matmul/python"
program_type: "python"
# target_hardware: "NVIDIA H100"  # optional: tells the agent what to optimize for
target_hardware: null

build: null

correctness:
  cmd: "python tests.py"
  expected_exit: 0

benchmark:
  cmd: "python bench.py --json out/bench.json"
  metric:
    name: "tflops.median"
    mode: "maximize"
  warmup: 1
  repeats: 3

profile_plan:
  always: ["cpu_flame"]

constraints:
  max_iters: 10
  regression_tolerance: 0.02
  rlimit_as_gb: 2

analysis_thresholds:
  perf_ipc_low: 0.5              # Python interpreter inherently has low IPC
  perf_hotspot_dominance_pct: 30.0 # interpreter overhead is distributed
  perf_cpus_utilized_low: 0.8    # single-threaded

contract:
  # Pinned to tuning.yaml. bench.py reports the shapes it actually multiplied
  # (not the knobs it read), so this is a real floor on problem size: a
  # candidate that quietly hands back smaller matrices fails contract
  # validation instead of posting a huge tflops number.
  fixed_params: { M: 256, N: 256, K: 256 }
  # bench.py reports meta.repeats/meta.warmup, so these bind. The fast screen
  # runs warmup=0/repeats=2 on purpose and is exempted by the framework
  # (validate_contract(enforce_min_sampling=False)); full benchmarks use the
  # benchmark.warmup/repeats above.
  min_repeats: 3
  min_warmup: 1
  required_bench_fields: ["ok", "tflops"]

# Reward-hack mitigations. The framework defaults already enable the first
# three; they are spelled out because this task is the reference example for
# the anti-gaming pipeline, and one of them needs a task-specific value.
anti_gaming:
  # Reject a candidate whose times_ms array has zero variance — real timing
  # always jitters, identical numbers mean a cached result.
  bench_variance_check: true
  # Re-run tests.py with PERFLAB_DETERMINISM_SEED set; tests.py folds it into
  # every seed, so the second run genuinely uses different data.
  determinism_rerun: true
  # Default is 10.0. Measured on this task at 256x256x256: the naive triple
  # loop runs ~370 ms/iter, numpy converting inside matmul() runs ~1.9 ms
  # (~200x), and numpy with random_matrix() also returning ndarrays runs
  # ~0.08 ms (~4700x). All three are legitimate, so the default would fire a
  # "possible benchmark gaming" warning on the exact edit this task exists to
  # demonstrate. The warning is advisory only, but a spurious one teaches the
  # wrong lesson. 10000x still catches the degenerate cases (a stubbed or
  # memoized kernel measures as ~0 s and lands orders of magnitude past it).
  gaming_speedup_threshold: 10000.0
  # Deliberately off: numpy dispatches into a multi-threaded BLAS, so a
  # thread-delta gate would reject the intended solution. Thread injection is
  # not a viable cheat here anyway — tests.py requires a correct result by the
  # time matmul() returns, so there is no async work to hide behind.
  thread_count_check: false

edit_policy:
  # matmul.py only. bench.py and tests.py are protected: the agent cannot
  # relax the contract reporting, the correctness gates, or the anti-gaming
  # checks it is being measured against.
  allowed_paths:
    - "matmul.py"

out_dir: "../../out"
