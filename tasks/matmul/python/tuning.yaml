# Numeric knobs for the `perflab optimize` command (knob sweep mode).
# These are NOT used by `perflab agent` — the agent edits source code directly.
#
# 256x256x256 is the laptop-demo size: 2 * 256^3 = 33.5 MFLOP, which the naive
# triple loop grinds through in ~0.37 s, so a full benchmark (1 warmup +
# 3 repeats) takes ~1.5 s and a 10-iteration agent run stays interactive.
# task.yaml pins these in contract.fixed_params and bench.py reports the shapes
# it actually multiplied, so a candidate cannot "optimize" by shrinking them.
M: 256
N: 256
K: 256
