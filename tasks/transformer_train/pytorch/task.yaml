name: "transformer_train_pytorch"
workspace: "tasks/transformer_train/pytorch"
program_type: "pytorch"
target_hardware: null

build: null

correctness:
  cmd: "python tests.py"
  expected_exit: 0

benchmark:
  cmd: "python bench.py --json out/bench.json"
  metric:
    name: "tokens_per_sec.median"
    mode: "maximize"
  warmup: 2
  repeats: 10

profile_plan:
  always: ["cpu_flame", "torch_trace"]

constraints:
  max_iters: 12
  regression_tolerance: 0.02

analysis_thresholds:
  gpu_cpu_ratio_low: 0.5         # training overhead is real but GPU should dominate at larger batch
  phase_dominance_pct: 40.0      # fwd/bwd/optim are all significant
  mem_alloc_overhead_pct: 0.10   # training allocates more
  sync_count_warn: 15            # gradient syncs expected
  nsys_gpu_fraction_low: 0.5     # some CPU work between steps
  ncu_tc_util_low: 20.0          # transformer matmuls should use Tensor Cores

contract:
  # tuning.yaml is agent-editable, so the problem size is pinned here. bench.py
  # reports the values it actually ran into bench.meta; a mismatch is a hard
  # error, so a candidate cannot shrink the batch or sequence length to "win".
  fixed_params: { batch_size: 32, seq_len: 512 }
  # bench.py reports meta.repeats / meta.warmup, so these are actually
  # enforced rather than skipped with a warning. Full runs use
  # benchmark.warmup=2 / benchmark.repeats=10 above; the agent's fast screen
  # legitimately runs with fewer and is exempt from min-sampling enforcement.
  min_repeats: 5
  min_warmup: 1
  required_bench_fields: ["ok", "tokens_per_sec"]

anti_gaming:
  # Set explicitly rather than relying on defaults so the demo has something
  # concrete to point at. See tests.py for the in-task harness checks
  # (assert_real_tensor / assert_deterministic / pointer poison) and bench.py
  # for SyncTimer + ThreadGuard.
  bench_variance_check: true     # zero-variance timings => results are cached
  determinism_rerun: true        # re-run correctness with a different seed
  # bench.py reports thread_delta measured across the steady-state timed loop
  # only — the snapshot is taken AFTER warmup, so torch.compile/inductor and
  # cuDNN worker pools (started on first use, entirely legitimate) are already
  # running and do not count. The small allowance absorbs pools that start
  # lazily a step or two later; a candidate that offloads the actual training
  # step to a background thread pool blows past it.
  thread_count_check: true
  max_thread_delta: 2
  # Raised from the 10.0 default. This baseline is deliberately pessimal —
  # fp32 + naive materialized-attention + no torch.compile — and the intended
  # solution stacks AMP, SDPA and torch.compile. On a modern accelerator that
  # combination legitimately clears 10x in a single iteration, which would
  # make the default fire on the very result the task is designed to produce.
  # Warn-only either way; 25x is still far above any honest single-step jump.
  gaming_speedup_threshold: 25.0

data_hints:
  dtype_safety: "bf16_safe"      # Training with BF16 mixed precision is safe
  batch_size_range: [8, 128]     # Typical training batch sizes
  sequence_lengths: "fixed"      # Fixed seq_len per contract
  access_pattern: "sequential"
  custom:
    - "Transformer model with attention, FFN, and layer norm"
    - "Loss function is cross-entropy"

edit_policy:
  allowed_paths:
    - "model.py"
    - "tuning.yaml"

out_dir: "../../out"
