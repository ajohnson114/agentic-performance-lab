name: stream-python
program_type: python

edit_policy:
  allowed_paths:
    - "*.py"

correctness:
  cmd: "python tests.py"

benchmark:
  cmd: "python bench.py --json out/bench.json"
  warmup: 1
  repeats: 5
  metric:
    name: "throughput.median"
    mode: "maximize"

constraints:
  max_iters: 8
  regression_tolerance: 0.02

contract:
  required_bench_fields:
    - ok
    - throughput
  min_repeats: 3
  # N lives in stream.py, which is editable. Without this pin the agent could
  # shrink the arrays until they fit in cache and report a huge GB/s that is a
  # cache-residency artifact, not an optimization. bench.py is protected
  # (PROTECTED_FILENAMES) and reports meta.N, so this is enforceable.
  fixed_params: { N: 4096 }

out_dir: "../../out"
