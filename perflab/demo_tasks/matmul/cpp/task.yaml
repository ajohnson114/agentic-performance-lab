name: "matmul_cpp"
workspace: "tasks/matmul/cpp"
program_type: "cpp"
# target_hardware: "NVIDIA H100"  # optional: tells the agent what to optimize for
target_hardware: null

build:
  # -O3, not -O2. At -O2 the agent's only route to vectorization was to write
  # `#pragma GCC optimize("O3","unroll-loops")` into matmul.cpp -- a legal edit
  # to an allowed file that silently overrides this pinned build line. Measured:
  # the algorithmic rewrite was worth 9.7x on its own, and the pragma added
  # another 4.0x on top, so the headline speedup was mostly compiler-flag
  # escalation. -O3 costs nothing in baseline inflation (the naive ijk kernel
  # measures 0.00176 at -O2 vs 0.00178 at -O3 -- it is bound on the strided B
  # access, which no flag fixes) and removes the incentive entirely.
  cmd: "g++ -O3 -o matmul_bin matmul.cpp"
  expected_exit: 0

correctness:
  cmd: "python tests.py"
  expected_exit: 0

benchmark:
  cmd: "python bench.py --json out/bench.json"
  metric:
    name: "tflops.median"
    mode: "maximize"
  warmup: 2
  repeats: 5

profile_plan:
  always: ["cpu_flame"]

constraints:
  max_iters: 12
  regression_tolerance: 0.02
  rlimit_as_gb: 4

anti_gaming:
  # This is a single-threaded, from-scratch cache-blocking exercise. Each entry
  # closes a route that would produce a large speedup without doing the work:
  #   optimization_pragmas - overrides the pinned -O level in build.cmd above
  #   openmp / threading   - the task measures single-core efficiency
  #   blas                 - calling a tuned GEMM is not writing one
  # SIMD intrinsics are deliberately ALLOWED: hand-vectorizing is real work.
  forbidden_constructs:
    - optimization_pragmas
    - openmp
    - threading
    - blas

analysis_thresholds:
  perf_ipc_low: 1.5              # tight matmul loop should have high IPC
  perf_cache_miss_rate_high: 0.02 # cache optimization is the whole point
  perf_hotspot_dominance_pct: 40.0 # single kernel should dominate
  perf_cpus_utilized_low: 0.8    # single-threaded task — don't flag 1 CPU

contract:
  fixed_params: { M: 512, N: 512, K: 512 }
  min_repeats: 3
  required_bench_fields: ["ok", "tflops"]

edit_policy:
  allowed_paths:
    - "matmul.cpp"

out_dir: "../../out"
